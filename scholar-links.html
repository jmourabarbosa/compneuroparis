<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Add Google Scholar Links</title>
<style>
  body { font-family: system-ui; max-width: 1200px; margin: 40px auto; padding: 0 20px; background: #111; color: #eee; }
  button { padding: 10px 24px; font-size: 16px; cursor: pointer; border: none; border-radius: 6px; }
  #loginBtn { background: #4285f4; color: white; }
  #loadBtn { background: #8b5cf6; color: white; font-size: 18px; padding: 14px 32px; }
  #saveBtn { background: #34a853; color: white; font-size: 18px; padding: 14px 32px; }
  #loadBtn:disabled, #saveBtn:disabled { background: #555; cursor: not-allowed; color: #999; }
  input[type="email"], input[type="password"] { padding: 8px 12px; font-size: 14px; border-radius: 4px; border: 1px solid #444; background: #222; color: #eee; width: 240px; }
  #authSection { margin-bottom: 24px; }
  .stats { margin-top: 16px; padding: 12px 16px; background: #1a1a1a; border-radius: 8px; font-size: 14px; display: flex; gap: 24px; align-items: center; flex-wrap: wrap; }
  .stats span { font-weight: 600; }
  .filter-bar { margin: 16px 0; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .filter-bar button { padding: 6px 14px; font-size: 13px; border-radius: 4px; border: 1px solid #444; background: #222; color: #ccc; cursor: pointer; }
  .filter-bar button.active { background: #4285f4; color: white; border-color: #4285f4; }
  .filter-bar input { padding: 6px 12px; font-size: 13px; border-radius: 4px; border: 1px solid #444; background: #222; color: #eee; width: 200px; }

  .pi-list { margin-top: 16px; }
  .pi-row { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-bottom: 1px solid #222; transition: background 0.15s; }
  .pi-row:hover { background: #1a1a1a; }
  .pi-row.has-scholar { opacity: 0.5; }
  .pi-row.has-scholar:hover { opacity: 1; }
  .pi-row.has-new { background: #1a2e1a; }
  .pi-num { color: #666; font-size: 12px; min-width: 30px; text-align: right; }
  .pi-name { font-weight: 600; min-width: 200px; max-width: 200px; }
  .pi-institute { font-size: 12px; color: #888; min-width: 180px; max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pi-status { font-size: 12px; min-width: 24px; text-align: center; }
  .pi-search-btn { padding: 4px 10px; font-size: 12px; background: #333; color: #4285f4; border: 1px solid #4285f4; border-radius: 4px; cursor: pointer; white-space: nowrap; }
  .pi-search-btn:hover { background: #4285f4; color: white; }
  .pi-url-input { flex: 1; padding: 6px 10px; font-size: 13px; border-radius: 4px; border: 1px solid #444; background: #222; color: #eee; min-width: 0; }
  .pi-url-input:focus { border-color: #4285f4; outline: none; }
  .pi-url-input.valid { border-color: #34a853; }
  .pi-url-input.prefilled { border-color: #666; color: #888; }
  .pi-clear-btn { padding: 4px 8px; font-size: 12px; background: #333; color: #ea4335; border: 1px solid #ea4335; border-radius: 4px; cursor: pointer; }
  .pi-clear-btn:hover { background: #ea4335; color: white; }
  #log { background: #1a1a1a; padding: 16px; border-radius: 8px; max-height: 300px; overflow-y: auto; font-family: monospace; font-size: 13px; white-space: pre-wrap; margin-top: 16px; }
  .success { color: #34a853; }
  .error { color: #ea4335; }
  .info { color: #4285f4; }
  .warn { color: #f5c842; }
  .keyboard-hint { margin-top: 12px; font-size: 12px; color: #666; }
  .keyboard-hint kbd { background: #333; padding: 2px 6px; border-radius: 3px; border: 1px solid #555; font-family: monospace; }
</style>
</head>
<body>
<h1>Add Google Scholar Links</h1>
<p style="color:#aaa;">Find Google Scholar profiles for each PI and paste the URL. Changes are previewed before applying.</p>

<div id="authSection">
  <p id="authStatus">Not logged in</p>
  <div id="loginForm">
    <input type="email" id="email" placeholder="Admin email">
    <input type="password" id="password" placeholder="Password">
    <button id="loginBtn" onclick="doLogin()">Login</button>
  </div>
</div>

<div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;">
  <button id="loadBtn" disabled onclick="loadPIs()">Load PIs</button>
  <button id="saveBtn" disabled onclick="saveAll()">Save to Firestore</button>
  <label style="font-size:13px;color:#aaa;display:flex;align-items:center;gap:6px;">
    <input type="checkbox" id="autoAdvance" checked> Auto-advance on paste
  </label>
</div>

<div class="stats" id="stats" style="display:none;"></div>

<div class="filter-bar" id="filterBar" style="display:none;">
  <button class="active" data-filter="all" onclick="setFilter('all',this)">All</button>
  <button data-filter="missing" onclick="setFilter('missing',this)">Missing</button>
  <button data-filter="new" onclick="setFilter('new',this)">New (unsaved)</button>
  <button data-filter="done" onclick="setFilter('done',this)">Already has Scholar</button>
  <input type="text" id="nameSearch" placeholder="Search by name..." oninput="applyFilter()">
</div>

<div class="pi-list" id="piList"></div>

<p class="keyboard-hint" id="keyboardHint" style="display:none;">
  Tip: Click "Search" to open Google Scholar, find the profile, copy the URL, paste it here. Use <kbd>Tab</kbd> to move to the next PI.
</p>

<div id="log"></div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.4.0/firebase-app.js';
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/11.4.0/firebase-auth.js';
import { getFirestore, collection, updateDoc, doc, serverTimestamp, getDocs, orderBy, query } from 'https://www.gstatic.com/firebasejs/11.4.0/firebase-firestore.js';

const firebaseConfig = {
  apiKey: "AIzaSyCEUSVBEAPYfsoG00GKPqw_lHJQKelgVbk",
  authDomain: "compneuroparis.firebaseapp.com",
  projectId: "compneuroparis",
  storageBucket: "compneuroparis.firebasestorage.app",
  messagingSenderId: "768335946036",
  appId: "1:768335946036:web:61184dde3b4b66c58bc561"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const logEl = document.getElementById('log');
function log(msg, cls = '') {
  const span = document.createElement('span');
  span.className = cls;
  span.textContent = msg + '\n';
  logEl.appendChild(span);
  logEl.scrollTop = logEl.scrollHeight;
}

let currentUser = null;
let piData = []; // Array of { id, name, institutes, links, existingScholarUrl, inputEl }
let currentFilter = 'all';

onAuthStateChanged(auth, user => {
  currentUser = user;
  if (user) {
    document.getElementById('authStatus').textContent = `Logged in as ${user.email}`;
    document.getElementById('loginForm').style.display = 'none';
    document.getElementById('loadBtn').disabled = false;
  }
});

window.doLogin = async () => {
  const email = document.getElementById('email').value;
  const pw = document.getElementById('password').value;
  try {
    await signInWithEmailAndPassword(auth, email, pw);
    log('Logged in!', 'success');
  } catch (e) {
    log('Login error: ' + e.message, 'error');
  }
};

// ========== LOAD PIs ==========

window.loadPIs = async () => {
  document.getElementById('loadBtn').disabled = true;
  log('Fetching PIs from Firestore...', 'info');

  try {
    const q = query(collection(db, 'groups'), orderBy('name'));
    const snap = await getDocs(q);
    const groups = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    log(`Fetched ${groups.length} PIs.`, 'success');

    piData = groups.map(g => {
      const links = g.links || [];
      const existingScholar = links.find(l =>
        l.url && l.url.includes('scholar.google')
      );
      return {
        id: g.id,
        name: g.name || '',
        institutes: g.institutes || [g.institute || ''],
        links,
        existingScholarUrl: existingScholar ? existingScholar.url : '',
        newUrl: '',
        inputEl: null,
        rowEl: null
      };
    });

    renderList();
    updateStats();
    document.getElementById('filterBar').style.display = 'flex';
    document.getElementById('keyboardHint').style.display = 'block';
    document.getElementById('saveBtn').disabled = false;
  } catch (e) {
    log('Error: ' + e.message, 'error');
    document.getElementById('loadBtn').disabled = false;
  }
};

function renderList() {
  const listEl = document.getElementById('piList');
  listEl.innerHTML = '';

  piData.forEach((pi, i) => {
    const row = document.createElement('div');
    row.className = 'pi-row';
    if (pi.existingScholarUrl) row.classList.add('has-scholar');

    const hasScholar = !!pi.existingScholarUrl;
    const scholarSearchUrl = `https://scholar.google.com/citations?view_op=search_authors&mauthors=${encodeURIComponent(pi.name)}+paris`;
    const instituteText = Array.isArray(pi.institutes) ? pi.institutes.join(', ') : pi.institutes;

    row.innerHTML = `
      <span class="pi-num">${i + 1}</span>
      <span class="pi-name">${esc(pi.name)}</span>
      <span class="pi-institute" title="${esc(instituteText)}">${esc(instituteText)}</span>
      <span class="pi-status">${hasScholar ? '&#10003;' : ''}</span>
      <a href="${scholarSearchUrl}" target="_blank" rel="noopener" class="pi-search-btn" tabindex="-1">Search</a>
    `;

    const input = document.createElement('input');
    input.type = 'url';
    input.className = 'pi-url-input';
    input.placeholder = hasScholar ? 'Already has link' : 'Paste Google Scholar URL...';
    input.value = pi.existingScholarUrl;
    if (pi.existingScholarUrl) input.classList.add('prefilled');

    input.addEventListener('input', () => {
      pi.newUrl = input.value.trim();
      input.classList.remove('prefilled');
      if (pi.newUrl && pi.newUrl.includes('scholar.google')) {
        input.classList.add('valid');
        row.classList.add('has-new');
      } else {
        input.classList.remove('valid');
        row.classList.remove('has-new');
      }
      updateStats();
    });

    input.addEventListener('paste', () => {
      // After paste, auto-advance to next missing PI
      setTimeout(() => {
        if (!document.getElementById('autoAdvance').checked) return;
        if (!input.value.includes('scholar.google')) return;
        const nextMissing = piData.find((p, j) => j > i && !p.existingScholarUrl && !p.newUrl);
        if (nextMissing && nextMissing.inputEl) {
          nextMissing.inputEl.focus();
          nextMissing.rowEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
      }, 50);
    });

    row.appendChild(input);

    // Clear button (only if has existing URL)
    if (hasScholar) {
      const clearBtn = document.createElement('button');
      clearBtn.className = 'pi-clear-btn';
      clearBtn.textContent = 'Clear';
      clearBtn.title = 'Clear to re-enter URL';
      clearBtn.addEventListener('click', () => {
        input.value = '';
        input.classList.remove('prefilled', 'valid');
        input.placeholder = 'Paste Google Scholar URL...';
        pi.newUrl = '';
        row.classList.remove('has-new');
        updateStats();
        input.focus();
      });
      row.appendChild(clearBtn);
    }

    pi.inputEl = input;
    pi.rowEl = row;
    listEl.appendChild(row);
  });

  applyFilter();
}

function updateStats() {
  const total = piData.length;
  const hasExisting = piData.filter(p => p.existingScholarUrl).length;
  const hasNew = piData.filter(p => p.newUrl && p.newUrl.includes('scholar.google') && p.newUrl !== p.existingScholarUrl).length;
  const missing = total - hasExisting - hasNew;

  const statsEl = document.getElementById('stats');
  statsEl.style.display = 'flex';
  statsEl.innerHTML = `
    <span style="color:#34a853;">${hasExisting} already have Scholar</span>
    <span style="color:#4285f4;">${hasNew} new URLs entered</span>
    <span style="color:#f5c842;">${missing} still missing</span>
    <span style="color:#aaa;">${total} total</span>
  `;
}

// ========== FILTERING ==========

window.setFilter = (filter, btn) => {
  currentFilter = filter;
  document.querySelectorAll('.filter-bar button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  applyFilter();
};

window.applyFilter = () => {
  const search = document.getElementById('nameSearch').value.toLowerCase();
  piData.forEach(pi => {
    if (!pi.rowEl) return;
    let show = true;

    // Filter by category
    const hasExisting = !!pi.existingScholarUrl;
    const hasNew = pi.newUrl && pi.newUrl.includes('scholar.google') && pi.newUrl !== pi.existingScholarUrl;

    if (currentFilter === 'missing') show = !hasExisting && !hasNew;
    else if (currentFilter === 'new') show = !!hasNew;
    else if (currentFilter === 'done') show = hasExisting;

    // Filter by name search
    if (show && search) {
      show = pi.name.toLowerCase().includes(search);
    }

    pi.rowEl.style.display = show ? 'flex' : 'none';
  });
};

// ========== SAVE ==========

window.saveAll = async () => {
  const toSave = piData.filter(p => {
    const url = p.newUrl || '';
    return url.includes('scholar.google') && url !== p.existingScholarUrl;
  });

  if (toSave.length === 0) {
    log('No new Google Scholar URLs to save.', 'warn');
    return;
  }

  document.getElementById('saveBtn').disabled = true;
  log(`\nSaving ${toSave.length} Google Scholar links...`, 'info');

  let saved = 0, errors = 0;

  for (const pi of toSave) {
    try {
      // Build updated links array
      const updatedLinks = [...(pi.links || [])];

      // Remove any existing Google Scholar link
      const existingIdx = updatedLinks.findIndex(l => l.url && l.url.includes('scholar.google'));
      if (existingIdx >= 0) updatedLinks.splice(existingIdx, 1);

      // Add new Google Scholar link at the beginning
      updatedLinks.unshift({ label: 'Google Scholar', url: pi.newUrl });

      await updateDoc(doc(db, 'groups', pi.id), {
        links: updatedLinks,
        updatedAt: serverTimestamp()
      });

      // Update local state
      pi.links = updatedLinks;
      pi.existingScholarUrl = pi.newUrl;

      log(`  Saved: ${pi.name}`, 'success');
      saved++;
    } catch (e) {
      log(`  Error saving ${pi.name}: ${e.message}`, 'error');
      errors++;
    }
  }

  log(`\nDone! Saved ${saved}, errors ${errors}.`, 'info');
  document.getElementById('saveBtn').disabled = false;
  updateStats();
};

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}
</script>
</body>
</html>

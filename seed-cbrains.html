});

// ========== SEED FUNCTIONS ==========

async function seedNewInstitutes() {
  log('--- Checking / Creating New Institutes ---', 'info');
  for (const inst of newInstitutes) {
    const q = query(collection(db, 'institutes'), where('name', '==', inst.name), where('status', '==', 'approved'));
    const snap = await getDocs(q);
    if (snap.size > 0) {
      log(`  Skip (exists): ${inst.name}`);
      continue;
    }
    await addDoc(collection(db, 'institutes'), {
      name: inst.name,
      website: inst.website,
      logoURL: inst.logoURL || '',
      status: 'approved',
      proposedBy: currentUser.uid,
      createdAt: serverTimestamp()
    });
    log(`  Created institute: ${inst.name}`, 'success');
  }
}

async function seedPIs() {
  log('--- Seeding C-BRAINS PIs ---', 'info');
  let created = 0, updated = 0, skipped = 0, errors = 0;
  for (const pi of pis) {
    const q = query(collection(db, 'groups'), where('name', '==', pi.name));
    const snap = await getDocs(q);
    if (snap.size > 0) {
      const existing = snap.docs[0];
      const data = existing.data();
      const needsPhoto = pi.photoURL && (!data.photoURL || data.photoURL === '');
      if (needsPhoto) {
        try {
          await updateDoc(doc(db, 'groups', existing.id), {
            photoURL: pi.photoURL,
            updatedAt: serverTimestamp()
          });
          log(`  Updated photo: ${pi.name}`, 'success');
          updated++;
        } catch (e) {
          log(`  ERROR updating ${pi.name}: ${e.message}`, 'error');
          errors++;
        }
      } else {
        log(`  Skip (exists): ${pi.name}`);
        skipped++;
      }
      continue;
    }
    try {
      await addDoc(collection(db, 'groups'), {
        name: pi.name,
        keywords: pi.keywords,
        summary: pi.summary,
        links: pi.links,
        photoURL: pi.photoURL || '',
        subfields: pi.subfields,
        institutes: pi.institutes,
        subfield: pi.subfields[0],
        institute: pi.institutes[0],
        creatorUid: currentUser.uid,
        createdAt: serverTimestamp(),
        updatedAt: serverTimestamp()
      });
      log(`  Created: ${pi.name}`, 'success');
      created++;
    } catch (e) {
      log(`  ERROR creating ${pi.name}: ${e.message}`, 'error');
      errors++;
    }
  }
  log(`\nDone! Created ${created}, updated photos ${updated}, skipped ${skipped}, errors ${errors}.`, 'info');
}

window.runSeed = async () => {
  document.getElementById('seedBtn').disabled = true;
  try {
    await seedNewInstitutes();
    await seedPIs();
  } catch (e) {
    log('ERROR: ' + e.message, 'error');
  }
  document.getElementById('seedBtn').disabled = false;
};

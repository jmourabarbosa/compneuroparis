  #seedBtn { background: #34a853; color: white; font-size: 18px; padding: 14px 32px; }
  #previewBtn { background: #8b5cf6; color: white; font-size: 18px; padding: 14px 32px; }

  #log { background: #1a1a1a; padding: 16px; border-radius: 8px; max-height: 400px; overflow-y: auto; font-family: monospace; font-size: 13px; white-space: pre-wrap; margin-top: 16px; }

  .error { color: #ea4335; }
  .info { color: #4285f4; }

  th { background: #222; position: sticky; top: 0; }
  .kw-new { color: #34a853; font-weight: 600; }
  .kw-existing { color: #888; }
  #previewTable { max-height: 600px; overflow-y: auto; margin-top: 16px; }
  .stats { margin-top: 16px; padding: 12px 16px; background: #1a1a1a; border-radius: 8px; font-size: 14px; }
  .stats span { margin-right: 16px; }

// ========== MANUAL OVERRIDES ==========
// For PIs where auto-detection misses important keywords or adds wrong ones.
// Format: { "PI Name": { add: [...], remove: [...] } }
const OVERRIDES = {
  // The pattern matcher may tag "depression" (mood disorder) for synaptic "depression" (LTD).
  // We handle this by only matching "depression" in psychiatric context, not synaptic.
  // If needed, add specific overrides here.
};

// ========== DETECTION LOGIC ==========

function detectBroadKeywords(pi) {
  const existingKws = (pi.keywords || []).map(k => k.toLowerCase());
  const summary = (pi.summary || '').toLowerCase();
  const combined = [...existingKws, summary].join(' ');

  const detected = [];

  for (const [broadKw, patterns] of Object.entries(KEYWORD_RULES)) {
    const matches = patterns.some(p => combined.includes(p));
    if (matches) detected.push(broadKw);
  }

  // Apply overrides
  const override = OVERRIDES[pi.name];
  if (override) {
    if (override.add) override.add.forEach(k => { if (!detected.includes(k)) detected.push(k); });
    if (override.remove) override.remove.forEach(k => {
      const idx = detected.indexOf(k);
      if (idx >= 0) detected.splice(idx, 1);
    });
  }

  return detected;
}

function mergeKeywords(existing, broad) {
  const lowerSet = new Set(existing.map(k => k.trim().toLowerCase()));
  const merged = [...existing];
  for (const bk of broad) {
    if (!lowerSet.has(bk.toLowerCase())) {
      merged.push(bk);
      lowerSet.add(bk.toLowerCase());
    }
  }
  return merged;
}

// ========== PREVIEW ==========

let previewData = null; // Array of { id, name, existing, broad, merged, newCount }

window.runPreview = async () => {
  document.getElementById('previewBtn').disabled = true;
  log('Fetching all PIs from Firestore...', 'info');

  try {
    const q = query(collection(db, 'groups'), orderBy('name'));
    const snap = await getDocs(q);
    const groups = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    log(`Fetched ${groups.length} PIs.`, 'success');

    previewData = groups.map(g => {
      const existing = g.keywords || [];
      const broad = detectBroadKeywords(g);
      const merged = mergeKeywords(existing, broad);
      const newKws = merged.filter(k => !existing.map(e => e.toLowerCase()).includes(k.toLowerCase()));
      return { id: g.id, name: g.name, institutes: g.institutes || [g.institute || ''], existing, broad, merged, newKws };
    });

    // Stats
    const totalNew = previewData.reduce((s, p) => s + p.newKws.length, 0);
    const avgTotal = (previewData.reduce((s, p) => s + p.merged.length, 0) / previewData.length).toFixed(1);
    const minTotal = Math.min(...previewData.map(p => p.merged.length));
    const maxTotal = Math.max(...previewData.map(p => p.merged.length));

    // Broad keyword coverage stats
    const broadCounts = {};
    for (const bk of Object.keys(KEYWORD_RULES)) broadCounts[bk] = 0;
    previewData.forEach(p => p.broad.forEach(bk => { broadCounts[bk] = (broadCounts[bk] || 0) + 1; }));
    const sortedBroad = Object.entries(broadCounts).sort((a, b) => b[1] - a[1]);

    const statsEl = document.getElementById('stats');
    statsEl.style.display = 'block';
    statsEl.innerHTML = `
      <div><strong>Summary:</strong> <span>${previewData.length} PIs</span> <span>${totalNew} new keywords to add</span> <span>Avg ${avgTotal} keywords/PI (min ${minTotal}, max ${maxTotal})</span></div>
      <details style="margin-top:8px;">
        <summary style="cursor:pointer;color:#4285f4;">Broad keyword coverage (click to expand)</summary>
        <div style="margin-top:8px;columns:3;column-gap:24px;font-size:12px;">
          ${sortedBroad.map(([k, c]) => `<div style="break-inside:avoid;"><span style="color:${c > 0 ? '#34a853' : '#ea4335'}">${c}</span> ${k}</div>`).join('')}
        </div>
      </details>
    `;

    // Preview table
    const tableEl = document.getElementById('previewTable');
    let html = '<table><thead><tr><th>#</th><th>PI Name</th><th>Institute</th><th>Existing Keywords</th><th>New Broad Keywords</th><th>Total</th></tr></thead><tbody>';
    previewData.forEach((p, i) => {
      const existingHtml = p.existing.map(k => `<span class="kw-existing">${esc(k)}</span>`).join(', ');
      const newHtml = p.newKws.map(k => `<span class="kw-new">${esc(k)}</span>`).join(', ');
      html += `<tr>
        <td>${i + 1}</td>
        <td>${esc(p.name)}</td>
        <td style="font-size:11px;">${esc(Array.isArray(p.institutes) ? p.institutes.join(', ') : p.institutes)}</td>
        <td>${existingHtml || '<em style="color:#666">none</em>'}</td>
        <td>${newHtml || '<em style="color:#666">none</em>'}</td>
        <td>${p.merged.length}</td>
      </tr>`;
    });
    html += '</tbody></table>';
    tableEl.innerHTML = html;

    document.getElementById('seedBtn').disabled = false;
    log('Preview ready. Review the table, then click "Apply Keywords to Firestore".', 'info');
  } catch (e) {
    log('Error: ' + e.message, 'error');
  } finally {
    document.getElementById('previewBtn').disabled = false;
  }
};

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// ========== APPLY ==========

window.runSeed = async () => {
  if (!previewData) { log('Run preview first!', 'error'); return; }

  document.getElementById('seedBtn').disabled = true;
  log(`\nApplying keywords to ${previewData.length} PIs...`, 'info');

  let updated = 0, skipped = 0, errors = 0;

  for (const p of previewData) {
    if (p.newKws.length === 0) {
      skipped++;
      continue;
    }
    try {
      await updateDoc(doc(db, 'groups', p.id), {
        keywords: p.merged,
        updatedAt: serverTimestamp()
      });
      log(`  Updated: ${p.name} (+${p.newKws.length} keywords)`, 'success');
      updated++;
    } catch (e) {
      log(`  Error updating ${p.name}: ${e.message}`, 'error');
      errors++;
    }
  }

  log(`\nDone! Updated ${updated}, skipped ${skipped} (no new keywords), errors ${errors}.`, 'info');
};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

const logEl = document.getElementById('log');
function log(msg, cls = '') {
  const span = document.createElement('span');
  span.className = cls;
  span.textContent = msg + '\n';
  logEl.appendChild(span);
  logEl.scrollTop = logEl.scrollHeight;
}

let currentUser = null;

onAuthStateChanged(auth, user => {
  currentUser = user;
  if (user) {
    document.getElementById('authStatus').textContent = `Logged in as ${user.email}`;
    document.getElementById('loginForm').style.display = 'none';
    document.getElementById('seedBtn').disabled = false;
  }
});

window.doLogin = async () => {
  const email = document.getElementById('email').value;
  const pw = document.getElementById('password').value;
  try {
    await signInWithEmailAndPassword(auth, email, pw);
    log('Logged in!', 'success');

    log('Login error: ' + e.message, 'error');

// ========== SEED FUNCTIONS ==========

async function seedNewInstitutes() {
  log('--- Checking / Creating New Institutes ---', 'info');
  for (const inst of newInstitutes) {
    const q = query(collection(db, 'institutes'), where('name', '==', inst.name), where('status', '==', 'approved'));
    const snap = await getDocs(q);
    if (snap.size > 0) {
      log(`  Skip (exists): ${inst.name}`);
      continue;
    }
    await addDoc(collection(db, 'institutes'), {
      name: inst.name,
      website: inst.website,
      logoURL: inst.logoURL || '',
      status: 'approved',
      proposedBy: currentUser.uid,
      createdAt: serverTimestamp()
    });
    log(`  Created institute: ${inst.name}`, 'success');
  }
}

async function seedPIs() {
  log('--- Seeding New PIs ---', 'info');
  let created = 0, skipped = 0, errors = 0;
  for (const pi of pis) {
    // Check if PI already exists by name
    const q = query(collection(db, 'groups'), where('name', '==', pi.name));
    const snap = await getDocs(q);
    if (snap.size > 0) {
      log(`  Skip (exists): ${pi.name}`);
      skipped++;
      continue;
    }
    try {
      await addDoc(collection(db, 'groups'), {
        name: pi.name,
        keywords: pi.keywords,
        summary: pi.summary,
        links: pi.links,
        photoURL: pi.photoURL || '',
        subfields: pi.subfields,
        institutes: pi.institutes,
        subfield: pi.subfields[0],
        institute: pi.institutes[0],
        creatorUid: currentUser.uid,
        createdAt: serverTimestamp(),
        updatedAt: serverTimestamp()
      });
      log(`  Created: ${pi.name}`, 'success');
      created++;
    } catch (e) {
      log(`  ERROR creating ${pi.name}: ${e.message}`, 'error');
      errors++;
    }
  }
  log(`\nDone! Created ${created}, skipped ${skipped} (already existed), errors ${errors}.`, 'info');
}

window.runSeed = async () => {
  document.getElementById('seedBtn').disabled = true;
  try {
    await seedNewInstitutes();
    await seedPIs();
  } catch (e) {
    log('ERROR: ' + e.message, 'error');
  }
  document.getElementById('seedBtn').disabled = false;
};
</script>

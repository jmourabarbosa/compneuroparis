<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Seed PIs</title>
<style>
  body { font-family: system-ui; max-width: 800px; margin: 40px auto; padding: 0 20px; background: #111; color: #eee; }
  button { padding: 10px 24px; font-size: 16px; cursor: pointer; border: none; border-radius: 6px; }
  #loginBtn { background: #4285f4; color: white; }
  #seedBtn { background: #34a853; color: white; font-size: 18px; padding: 14px 32px; }
  #seedBtn:disabled, #updateBtn:disabled { background: #555; cursor: not-allowed; color: #999; }
  #log { background: #1a1a1a; padding: 16px; border-radius: 8px; max-height: 500px; overflow-y: auto; font-family: monospace; font-size: 13px; white-space: pre-wrap; margin-top: 16px; }
  .success { color: #34a853; }
  .error { color: #ea4335; }
  .info { color: #4285f4; }
  input { padding: 8px 12px; font-size: 14px; border-radius: 4px; border: 1px solid #444; background: #222; color: #eee; width: 240px; }
  #authSection { margin-bottom: 24px; }
</style>
</head>
<body>
<h1>Seed Paris Neuroscience PIs</h1>

<div id="authSection">
  <p id="authStatus">Not logged in</p>
  <div id="loginForm">
    <input type="email" id="email" placeholder="Admin email">
    <input type="password" id="password" placeholder="Password">
    <button id="loginBtn" onclick="doLogin()">Login</button>
    <button onclick="doReset()" style="background:#666;color:#fff;margin-left:8px;">Reset Password</button>
  </div>
</div>

<button id="seedBtn" disabled onclick="runSeed()">Seed All PIs</button>
<button id="updateBtn" disabled onclick="runUpdate()" style="background:#f59e0b;color:#111;font-size:18px;padding:14px 32px;margin-left:12px;">Update Existing PIs</button>
<div id="log"></div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.4.0/firebase-app.js';
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, sendPasswordResetEmail } from 'https://www.gstatic.com/firebasejs/11.4.0/firebase-auth.js';
import { getFirestore, collection, addDoc, updateDoc, doc, serverTimestamp, query, where, getDocs } from 'https://www.gstatic.com/firebasejs/11.4.0/firebase-firestore.js';

const firebaseConfig = {
  apiKey: "AIzaSyCEUSVBEAPYfsoG00GKPqw_lHJQKelgVbk",
  authDomain: "compneuroparis.firebaseapp.com",
  projectId: "compneuroparis",
  storageBucket: "compneuroparis.firebasestorage.app",
  messagingSenderId: "768335946036",
  appId: "1:768335946036:web:61184dde3b4b66c58bc561"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const logEl = document.getElementById('log');
function log(msg, cls = '') {
  const span = document.createElement('span');
  span.className = cls;
  span.textContent = msg + '\n';
  logEl.appendChild(span);
  logEl.scrollTop = logEl.scrollHeight;
}

let currentUser = null;

onAuthStateChanged(auth, user => {
  currentUser = user;
  if (user) {
    document.getElementById('authStatus').textContent = `Logged in as ${user.email}`;
    document.getElementById('loginForm').style.display = 'none';
    document.getElementById('seedBtn').disabled = false;
    document.getElementById('updateBtn').disabled = false;
  }
});

window.doLogin = async () => {
  const email = document.getElementById('email').value;
  const pw = document.getElementById('password').value;
  try {
    await signInWithEmailAndPassword(auth, email, pw);
    log('Logged in!', 'success');
  } catch (e) {
    log('Login error: ' + e.message, 'error');
  }
};

window.doReset = async () => {
  const email = document.getElementById('email').value;
  if (!email) { log('Enter email first', 'error'); return; }
  try {
    await sendPasswordResetEmail(auth, email);
    log('Password reset email sent to ' + email, 'success');
  } catch (e) {
    log('Reset error: ' + e.message, 'error');
  }
};

// ---------- PI DATA ----------
const institutes = [
  { name: "ENS - Ecole Normale Superieure", website: "https://cognition.ens.fr/en" },
  { name: "Paris Brain Institute (ICM)", website: "https://parisbraininstitute.org" },
  { name: "Institut Pasteur", website: "https://research.pasteur.fr/en/department/neuroscience/" },
  { name: "ESPCI Paris", website: "https://www.bio.espci.fr" },
  { name: "College de France", website: "https://www.college-de-france.fr" },
  { name: "CEA NeuroSpin", website: "https://joliot.cea.fr/drf/joliot/en/Pages/research_entities/NeuroSpin.aspx" },
  { name: "NeuroPSI (Paris-Saclay)", website: "https://neuropsi.cnrs.fr/en/homepage/" },
  { name: "INCC - Universite Paris Cite", website: "https://incc-paris.fr" },
  { name: "ISIR - Sorbonne Universite", website: "https://www.isir.upmc.fr" },
  { name: "Institut de la Vision", website: "https://www.institut-vision.org/en/" },
  { name: "Institut de l'Audition", website: "https://www.institut-audition.fr/en" },
  { name: "IPNP - Universite Paris Cite", website: "https://ipnp.paris5.inserm.fr" },
  { name: "SPPIN - Universite Paris Cite", website: "https://www.sppin.fr" },
  { name: "IBENS - ENS", website: "https://www.bio.ens.psl.eu" },
  { name: "INRIA Paris", website: "https://www.inria.fr/en/centre-inria-de-paris" },
];

const pis = [
  // ===== ENS - LNC2 / GNT =====
  { name:"Boris Gutkin", keywords:["neural dynamics","neuromodulation","addiction","motivated behavior","machine learning"], summary:"Interested in understanding how neuromodulatory processes shape neuronal dynamics in brain circuits, particularly exploring mechanisms underlying motivated behavior, addiction progression, and information processing through computational modeling combining statistical physics and dynamical systems approaches.", website:"https://gnt.dec.ens.fr/en/member/636/boris-gutkin", photoURL:"https://lnc2.dec.ens.fr/sites/cognition.ens.fr/files/styles/300x300/public/pictures/2017-10/Boris_Gutkin.jpg", subfields:["computational"], institutes:["ENS - Ecole Normale Superieure"] },
  { name:"Sophie Deneve", keywords:["neural coding","Bayesian inference","predictive coding","spiking networks","excitation-inhibition balance"], summary:"Interested in how biological neural networks implement probabilistic inference and efficient coding through balanced excitation and inhibition. Studies how spike trains in cortical networks can communicate probability distributions using predictive coding strategies, and how recurrent networks perform Bayesian inference reliably at the level of individual spikes.", website:"https://gnt.dec.ens.fr/en/member/628/sophie-deneve", photoURL:"https://gnt.dec.ens.fr/sites/cognition.ens.fr/files/styles/300x300/public/pictures/2017-10/sophie_crop.jpg", subfields:["computational"], institutes:["ENS - Ecole Normale Superieure"] },
  { name:"Srdjan Ostojic", keywords:["recurrent neural networks","low-rank networks","neural dynamics","population coding","machine learning"], summary:"Interested in how collective dynamics in recurrent neural networks implement computations underlying behavior. Studies low-rank recurrent network architectures that provide tractable frameworks for linking connectivity patterns to low-dimensional dynamics and computational functions in cortical circuits.", website:"https://lnc2.dec.ens.fr/en/member/655/srdjan-ostojic", photoURL:"https://lnc2.dec.ens.fr/sites/cognition.ens.fr/files/styles/300x300/public/pictures/2017-10/srdjan.jpg", subfields:["computational"], institutes:["ENS - Ecole Normale Superieure"] },
  { name:"Alex Cayco Gajic", keywords:["cerebellum","motor learning","dimensionality reduction","neural population dynamics","cortico-cerebellar interactions"], summary:"Studies how the cerebellum coordinates with motor cortex and basal ganglia during motor and cognitive learning. Uses quantitative methods including dynamical systems theory, statistical modeling, and machine learning to understand cerebellar function and develop dimensionality reduction approaches for identifying how latent dynamics in neural populations emerge during learning.", website:"https://sites.google.com/view/caycogajic/home", photoURL:"https://caycogajiclab.github.io/img/portraits/alex.jpg", subfields:["computational"], institutes:["ENS - Ecole Normale Superieure"] },
  { name:"Etienne Koechlin", keywords:["prefrontal cortex","cognitive control","decision-making","executive function","hierarchical control"], summary:"Interested in how the human prefrontal cortex supports decision-making and cognitive control through hierarchical organization. Studies how lateral prefrontal regions form a cascade of top-down executive processes controlling behavior according to stimuli, perceptual context, and temporal episodes, using neuroimaging and information-theoretic approaches.", website:"https://lnc2.dec.ens.fr/en/member/642/etienne-koechlin", photoURL:"", subfields:["computational","human"], institutes:["ENS - Ecole Normale Superieure"] },
  { name:"Valentin Wyart", keywords:["confidence","decision-making under uncertainty","Bayesian inference","belief updating","EEG"], summary:"Studies human decision-making under uncertainty and the role of confidence in controlling perceptual processing. Interested in how confidence signals shape evidence accumulation and belief updating, combining psychophysics, computational modeling, and EEG recordings to understand how neural variability supports adaptive decision-making.", website:"https://sites.google.com/site/valentinwyart/", photoURL:"https://lnc2.dec.ens.fr/sites/cognition.ens.fr/files/styles/300x300/public/pictures/2025-03/Valentin.jpg", subfields:["computational","human"], institutes:["ENS - Ecole Normale Superieure"] },
  { name:"Catherine Tallon-Baudry", keywords:["consciousness","interoception","visceral signals","gut-brain coupling","neural oscillations"], summary:"Interested in how visceral signals from the gut and other internal organs contribute to subjective experience and the first-person perspective of consciousness. Studies how the brain monitors visceral inputs like heartbeats and gastric rhythms, and whether neural responses to bodily signals constitute a neural implementation of the sense of self.", website:"https://sites.google.com/view/tallon-baudry-lab/home", photoURL:"https://lnc2.dec.ens.fr/sites/cognition.ens.fr/files/styles/300x300/public/pictures/2017-10/CTB2016.png", subfields:["human"], institutes:["ENS - Ecole Normale Superieure"] },
  { name:"Stefano Palminteri", keywords:["reinforcement learning","reward","punishment","value-based decision-making","computational psychiatry"], summary:"Investigates how humans learn from rewards and punishments using computational modeling and neuroimaging. Studies context-dependent outcome encoding showing how option values are learned relative to contextual reference points, and examines how impairments in these learning processes might contribute to psychiatric symptoms.", website:"https://sites.google.com/site/stefanopalminteri/home", photoURL:"https://lnc2.dec.ens.fr/sites/cognition.ens.fr/files/styles/300x300/public/pictures/2019-08/stefano.jpg", subfields:["computational","human"], institutes:["ENS - Ecole Normale Superieure"] },
  { name:"Julie Grezes", keywords:["social cognition","emotion","body language","action perception","social neuroscience"], summary:"Studies the neural basis of social perception and emotional processing, investigating how the brain interprets body language and social signals to grasp emotional messages in gestures. Interested in mechanisms for reading others' intentions and emotions through their actions, and how perceived social cues motivate purposeful behavior during interactions.", website:"https://sites.google.com/view/juliegrezes/home", photoURL:"https://lnc2.dec.ens.fr/sites/cognition.ens.fr/files/styles/300x300/public/pictures/2017-10/JG.png", subfields:["human"], institutes:["ENS - Ecole Normale Superieure"] },
  { name:"Coralie Chevallier", keywords:["social cognition","autism","behavioral science","public policy","social decision-making"], summary:"Interested in social cognition, its development, and disruptions in autism spectrum disorders, focusing on how social motivation deficits play a central role. Studies the behavioral, biological, and evolutionary underpinnings of social motivation and emotion processing, and applies behavioral science principles to public policy and evidence-based interventions.", website:"https://sites.google.com/site/coraliechevallier/", photoURL:"https://lnc2.dec.ens.fr/sites/cognition.ens.fr/files/styles/300x300/public/pictures/2017-10/CC.png", subfields:["human"], institutes:["ENS - Ecole Normale Superieure"] },
  // ===== ENS - LSCP =====
  { name:"Emmanuel Dupoux", keywords:["speech processing","cognitive modeling","machine learning","language models","zero-resource learning"], summary:"Interested in reverse-engineering language acquisition by developing unsupervised machine learning algorithms that discover speech and language units from raw sensory data, mimicking how infants learn. Studies cognitive development, psycholinguistics, and textless speech processing to understand the computational principles underlying human language learning.", website:"http://www.lscp.net/persons/dupoux/", photoURL:"https://lscp.dec.ens.fr/sites/cognition.ens.fr/files/styles/300x300/public/pictures/2021-10/emmanuel_dupoux.png", subfields:["computational","human"], institutes:["ENS - Ecole Normale Superieure"] },
  { name:"Sid Kouider", keywords:["consciousness","attention","subliminal processing","infant cognition","neural correlates"], summary:"Studies the neural correlates of consciousness and how conscious and unconscious processes differ at psychological and neural levels. Interested in subliminal perception, unconscious semantic processing, and the emergence of consciousness in infants, using event-related potentials to identify electrophysiological signatures of awareness in developing brains.", website:"https://sidkouider.com/", photoURL:"https://lscp.dec.ens.fr/sites/cognition.ens.fr/files/styles/300x300/public/pictures/2017-10/sid_kouider.jpg", subfields:["human"], institutes:["ENS - Ecole Normale Superieure"] },
  { name:"Franck Ramus", keywords:["dyslexia","language disorders","cognitive development","genetics of cognition","neurodevelopmental disorders"], summary:"Investigates individual differences in cognitive development and school achievement, exploring their cognitive, neural, genetic, and environmental bases. Studies the core cognitive deficits in dyslexia and specific language impairment, examining phonological processing, white matter pathways, and comorbidity between neurodevelopmental disorders.", website:"http://www.lscp.net/persons/ramus/en/", photoURL:"https://lscp.dec.ens.fr/sites/cognition.ens.fr/files/styles/300x300/public/pictures/2017-12/ramus_m%C3%A9decine_4_1.png", subfields:["human"], institutes:["ENS - Ecole Normale Superieure"] },
  // ===== ENS - LSP =====
  { name:"Shihab Shamma", keywords:["auditory neuroscience","speech perception","music cognition","neural coding","cortical processing"], summary:"Studies computational principles underlying the processing and recognition of complex sounds including speech and music in the auditory system. Interested in neurophysiology and computational modeling of auditory cortex, spectro-temporal processing, and how sensorimotor interactions facilitate adaptive auditory cognition and learning.", website:"https://lsp.dec.ens.fr/en/member/667/shihab-shamma", photoURL:"https://faculty.eng.umd.edu/sites/faculty.eng.umd.edu/files/profile_images/sas.jpg", subfields:["systems","computational"], institutes:["ENS - Ecole Normale Superieure"] },
  { name:"Daniel Pressnitzer", keywords:["auditory perception","psychoacoustics","auditory scene analysis","temporal processing"], summary:"Interested in auditory perception with emphasis on the temporal structure of sounds and sound scenes. Studies auditory scene analysis, bistable perception, auditory memory, how prior context shapes the parsing of ambiguous sounds across multiple temporal and spectral scales, and the neural bases underlying these perceptual phenomena.", website:"http://audition.ens.fr/dp/", photoURL:"https://lsp.dec.ens.fr/sites/cognition.ens.fr/files/styles/300x300/public/pictures/2017-09/DPRESSNITZER.jpg", subfields:["human","computational"], institutes:["ENS - Ecole Normale Superieure"] },
  { name:"Pascal Mamassian", keywords:["visual perception","perceptual confidence","Bayesian perception","sensory decision-making"], summary:"Investigates visual perception and perceptual decision-making using Bayesian and psychophysical approaches. Studies three-dimensional perception, cross-modal interactions, temporal dynamics of bistable perception, confidence judgments, and how observers evaluate the precision of their own perceptual choices through probabilistic modeling.", website:"http://mamassian.free.fr/free/Home.html", photoURL:"https://lsp.dec.ens.fr/sites/cognition.ens.fr/files/styles/300x300/public/pictures/2017-10/PM.jpg", subfields:["human","computational"], institutes:["ENS - Ecole Normale Superieure"] },
  // ===== ICM =====
  { name:"Mathias Pessiglione", keywords:["motivation","effort","reward","neuroeconomics","computational neuroscience"], summary:"Builds neuro-computational models of how the brain motivates behavior and allocates effort to attain goals. Studies how motivation depends on reward magnitude, probability, delay and cost, how it is modified through learning and social contexts, and how cortical, subcortical and neuromodulatory systems mediate trade-offs between effort and reward.", website:"https://sites.google.com/site/motivationbrainbehavior/", photoURL:"https://parisbraininstitute.org/sites/default/files/styles/max_325x325/public/2025-08/mathias-pessiglione.jpg", subfields:["computational","human"], institutes:["Paris Brain Institute (ICM)"] },
  { name:"Jean Daunizeau", keywords:["Bayesian inference","variational methods","computational psychiatry","decision-making","VBA toolbox"], summary:"Develops Bayesian and variational approaches for computational neuroscience and psychiatry. Studies hierarchical frameworks for tracking beliefs and uncertainty in learning and decision-making, and works on the Variational Bayesian Analysis toolbox and mixed-effects modeling approaches that enable computational phenotyping in psychiatric research.", website:"https://sites.google.com/site/jeandaunizeauswebsite/", photoURL:"https://parisbraininstitute.org/sites/default/files/styles/max_325x325/public/2024-07/13-30_Jean%20Daunizeau.jpg", subfields:["computational"], institutes:["Paris Brain Institute (ICM)"] },
  { name:"Lionel Naccache", keywords:["consciousness","subliminal perception","unconscious processing","neuropsychology","cognitive functions"], summary:"Explores the neural bases of consciousness and cognitive functions, studying the boundary between conscious and unconscious processing. Interested in subliminal semantic processing, how brain damage alters awareness, and developing real-time consciousness indicators using EEG markers for patients with disorders of consciousness.", website:"https://parisbraininstitute.org/collaborators/naccache-lionel", photoURL:"https://parisbraininstitute.org/sites/default/files/styles/max_325x325/public/2024-07/13_30_Lionel_Naccache.jpg", subfields:["human"], institutes:["Paris Brain Institute (ICM)"] },
  { name:"Paolo Bartolomeo", keywords:["spatial cognition","hemispatial neglect","attention","visual awareness","brain lesion studies"], summary:"Explores the neural bases of spatial cognition and attention, particularly hemispatial neglect following right hemisphere lesions. Studies how damage or disconnection of attentional networks including temporo-parietal junction produces deficits in spatial and non-spatial attention, and how interhemispheric communication influences recovery.", website:"https://www.paolobartolomeo.eu/", photoURL:"https://parisbraininstitute.org/sites/default/files/styles/max_325x325/public/2025-08/paolo-bartolomeo.jpg", subfields:["human"], institutes:["Paris Brain Institute (ICM)"] },
  { name:"Julia Sliwa", keywords:["social neuroscience","primate cognition","fMRI","neurophysiology","theory of mind"], summary:"Studies neural mechanisms enabling transformation of social percepts into social knowledge in primates. Uses fMRI and neurophysiology to investigate specialized networks for social cognition in prefrontal cortex, combining ethological tests, neuroimaging, and cross-species comparisons to understand how primates extract meaning from complex social scenes.", website:"https://sites.google.com/view/sliwa-group/people", photoURL:"https://parisbraininstitute.org/sites/default/files/styles/max_325x325/public/2025-01/julia-sliwa.png", subfields:["systems","human"], institutes:["Paris Brain Institute (ICM)"] },
  { name:"Nikolas Karalis", keywords:["brain dynamics","internal states","neuromodulation","neural oscillations","electrophysiology"], summary:"Studies the fundamental link between brain activity and neurotransmitter balance, exploring how internal states are generated and modulated by neurochemical dynamics. Interested in how simultaneous release of neuromodulators influences neuronal coordination across brain regions, and how bodily signals such as breathing serve as oscillatory elements in circuit architecture.", website:"https://www.neuronaldynamics.eu/", photoURL:"https://parisbraininstitute.org/sites/default/files/styles/max_325x325/public/2024-07/11_Nikolas%20Karalis.jpg", subfields:["systems","computational"], institutes:["Paris Brain Institute (ICM)"] },
  { name:"Alberto Bacci", keywords:["cortical microcircuits","GABAergic interneurons","inhibition","synaptic plasticity","autapses"], summary:"Studies cellular physiology of cortical microcircuits, focusing on how diverse GABAergic interneuron populations perform plastic modulation of cortical circuits. Interested in connectivity logic, layer- and neuron-specific forms of plasticity, functional roles of interneurons during sensory processing, and cellular determinants of dendritic inhibitory synapses.", website:"https://baccilab.org/", photoURL:"https://parisbraininstitute.org/sites/default/files/styles/max_325x325/public/2024-10/boj_frm_abacci_426_crop_ctrst.jpg", subfields:["systems"], institutes:["Paris Brain Institute (ICM)"] },
  { name:"Nelson Rebola", keywords:["visual cortex","synaptic physiology","two-photon imaging","circuit diversity","sensory coding"], summary:"Studies how variability in synaptic function across neuronal types shapes sensory coding in neocortical circuits. Combines in vivo two-photon imaging, electrophysiology, optogenetics, and genetically encoded sensors to understand how cellular mechanisms in primary visual cortex influence neural networks and sensory perception.", website:"https://therebolalab.org/", photoURL:"https://parisbraininstitute.org/sites/default/files/styles/max_325x325/public/2024-07/13_30_NelsonRebola-2.gif", subfields:["systems"], institutes:["Paris Brain Institute (ICM)"] },
  { name:"Fabrizio De Vico Fallani", keywords:["brain networks","network neuroscience","brain-computer interfaces","graph theory","complex systems"], summary:"Uses network science and graph theory to model organizational principles of brain architecture and function through analysis of connectivity patterns. Develops brain-computer interfaces using network-based metrics to decode mental intentions, studying how reinforcement of motor-related activity during BCI learning parallels progressive disconnection of associative areas.", website:"https://sites.google.com/site/devicofallanifabrizio/", photoURL:"https://parisbraininstitute.org/sites/default/files/styles/max_325x325/public/2025-10/fabrizio-de-vico-fallani_0.jpeg", subfields:["computational"], institutes:["Paris Brain Institute (ICM)","INRIA Paris"] },
  { name:"Olivier Colliot", keywords:["machine learning","neuroimaging","neurodegenerative diseases","deep learning","medical image analysis"], summary:"Develops machine learning and AI approaches for studying brain diseases from multimodal neuroimaging data, focusing on benchmarking and validation of medical AI methods. Interested in interpretability of deep learning in medical contexts, and applying computational techniques to diagnose, predict and prevent neurodegenerative disorders.", website:"https://oliviercolliot.github.io/", photoURL:"https://parisbraininstitute.org/sites/default/files/styles/max_325x325/public/2024-07/13-30_Olivier%20Coliot.jpg", subfields:["computational"], institutes:["Paris Brain Institute (ICM)","INRIA Paris"] },
  { name:"Ninon Burgos", keywords:["medical image computing","deep learning","neuroimaging","anomaly detection","computer-aided diagnosis"], summary:"Focuses on medical image computing and deep learning for neuroimaging. Develops anomaly detection methods using generative models, quality control approaches, and individual brain image analysis for differential diagnosis in neurological diseases, addressing challenges of exploiting heterogeneous clinical data for reproducible research.", website:"https://ninonburgos.com/", photoURL:"https://parisbraininstitute.org/sites/default/files/styles/max_325x325/public/2025-01/burgos_ninon.jpg", subfields:["computational"], institutes:["Paris Brain Institute (ICM)","INRIA Paris"] },
  { name:"Claire Wyart", keywords:["spinal cord","sensorimotor integration","zebrafish","cerebrospinal fluid","optogenetics"], summary:"Combines genetics, biophysics, and physiology to understand how sensory inputs are integrated in the spinal cord during development and locomotion. Studies cerebrospinal fluid-contacting neurons that detect spinal curvature and CSF flow, investigating how these mechanoreceptors modulate locomotion, posture, and spinal morphogenesis in zebrafish.", website:"https://wyartlab.org/", photoURL:"https://parisbraininstitute.org/sites/default/files/styles/max_325x325/public/2024-07/13-30_Claire_Wyart.JPG", subfields:["systems"], institutes:["Paris Brain Institute (ICM)"] },
  { name:"Thomas Andrillon", keywords:["sleep","local sleep","consciousness","attention","EEG"], summary:"Studies how local sleep intrusions into the awake brain explain attention lapses, investigating how sleep and wakefulness can intermingle with wake-like and sleep-like activity occurring simultaneously in different brain regions. Interested in how sleep-like slow waves emerge locally during waking and accompany mind wandering and mind blanking.", website:"https://thomas-andrillon.wixsite.com/research", photoURL:"https://parisbraininstitute.org/sites/default/files/styles/max_325x325/public/2024-07/andrillon-thomas-163x195.jpg", subfields:["human","computational"], institutes:["Paris Brain Institute (ICM)"] },
  { name:"Delphine Oudiette", keywords:["sleep","dreams","lucid dreaming","creativity","memory consolidation"], summary:"Studies how sleep and dreams impact cognitive functions including memory, creativity, and problem-solving. Interested in hybrid states between wake and sleep like lucid dreaming and the sleep onset period, how falling asleep facilitates creativity through specific brain mechanisms, and the role of dreams in emotional processing.", website:"https://parisbraininstitute.org/paris-brain-institute-research-teams/dreamteam-sleep-dreams-and-cognition", photoURL:"https://parisbraininstitute.org/sites/default/files/styles/max_325x325/public/2024-07/oudiette-delphine-163x195.jpg", subfields:["human"], institutes:["Paris Brain Institute (ICM)"] },
  { name:"Liane Schmidt", keywords:["motivation","interoception","beliefs","self-regulation","placebo"], summary:"Studies how beliefs, expectations, and self-suggestions influence motivation, decision-making, interoception, and responsiveness to treatments. Interested in brain-body interactions in food decision-making, how motivation mediates treatment responses, and how hunger expectancies induced by suggestion determine sensations and choices.", website:"https://sites.google.com/view/icm-cia-team/team-members", photoURL:"https://parisbraininstitute.org/sites/default/files/styles/max_325x325/public/2024-07/25_26_LianeSchmidt.jpg", subfields:["human","computational"], institutes:["Paris Brain Institute (ICM)"] },
  { name:"Jacobo Sitt", keywords:["consciousness","disorders of consciousness","neuroimaging","complexity measures","EEG"], summary:"Develops computational tools for diagnosing disorders of consciousness using EEG-based markers including complexity, connectivity, and spectral measures. Studies how states of consciousness are associated with emergence of long-range connections and anti-correlations between brain areas, creating analysis pipelines to assess consciousness in non-communicating patients.", website:"https://parisbraininstitute.org/collaborators/jacobo-sitt", photoURL:"https://parisbraininstitute.org/sites/default/files/styles/max_325x325/public/2024-07/sitt-jacobo.jpg", subfields:["computational","human"], institutes:["Paris Brain Institute (ICM)"] },
  { name:"Nicolas Renier", keywords:["brain plasticity","tissue clearing","whole-brain mapping","3D imaging","iDISCO"], summary:"Develops and applies tissue clearing methods including iDISCO and whole-brain mapping approaches using light sheet microscopy to study brain plasticity at whole-brain scale. Studies brain-wide rearrangements of vasculature and how structural changes occur across entire neural networks at cellular resolution.", website:"https://www.renier-lab.com/", photoURL:"https://parisbraininstitute.org/sites/default/files/styles/max_325x325/public/2024-07/13-30_RENIER%20Nicolas.JPG", subfields:["systems"], institutes:["Paris Brain Institute (ICM)"] },
  { name:"Dafni Hadjieconomou", keywords:["gut-brain axis","enteric nervous system","Drosophila","interoception"], summary:"Studies gut-brain communication and physiology of the enteric nervous system using Drosophila. Interested in how enteroendocrine hormones remodel gut-innervating neurons to serve metabolic demands, and how gut-to-brain signaling through central neurons closes interoceptive loops connecting midgut signals to feeding organs.", website:"https://parisbraininstitute.org/collaborators/dafni-hadjieconomou", photoURL:"https://parisbraininstitute.org/sites/default/files/styles/max_325x325/public/2024-07/07_10_Dafni_2023-10-16-SELECTION%20HD-BY%20SIMON%20CASSANAS-002.jpg", subfields:["systems"], institutes:["Paris Brain Institute (ICM)"] },
  { name:"Stanley Durrleman", keywords:["statistical learning","disease progression modeling","neurodegeneration","differential geometry","neuroinformatics"], summary:"Develops methods and algorithms for building dynamic models of neurodegenerative disease progression using differential geometry and hierarchical statistical modeling. Constructs personalized progression models for Alzheimer's, Parkinson's, and Huntington's diseases that identify optimal moments for testing therapies in each patient.", website:"https://who.rocq.inria.fr/Stanley.Durrleman/", photoURL:"https://parisbraininstitute.org/sites/default/files/styles/max_325x325/public/2025-08/stanley-durrleman.jpg?itok=gW51ytg2", subfields:["computational"], institutes:["Paris Brain Institute (ICM)","INRIA Paris"] },
  { name:"Marie-Constance Corsi", keywords:["brain-computer interfaces","EEG","neurophysiology","BCI training","network neuroscience"], summary:"Develops tools to address brain-computer interface inefficiency through network neuroscience approaches, studying neuronal avalanches and brain critical dynamics. Interested in how network connectivity changes during BCI skill acquisition, and explores fusion of EEG and MEG signals for improved motor imagery classification.", website:"https://marieconstance-corsi.netlify.app/", photoURL:"https://parisbraininstitute.org/sites/default/files/styles/max_325x325/public/2025-10/marie-constance-corsi.jpg?itok=t3mIELCI", subfields:["computational"], institutes:["Paris Brain Institute (ICM)","INRIA Paris"] },
  { name:"Brian Lau", keywords:["basal ganglia","deep brain stimulation","motor control","electrophysiology","neurofeedback"], summary:"Studies the role of basal ganglia in movement and cognitive control, combining fundamental investigations with clinical deep brain stimulation research. Interested in characterizing pathophysiology of cortical-subcortical circuits and developing novel DBS approaches based on electrophysiological biomarkers for gait and balance disorders.", website:"https://parisbraininstitute.org/collaborators/lau-brian", photoURL:"https://parisbraininstitute.org/sites/default/files/styles/max_325x325/public/2024-07/13_30_BrianLau_0.jpg?itok=SfvvJ-ed", subfields:["systems","computational"], institutes:["Paris Brain Institute (ICM)"] },
  // ===== Institut Pasteur =====
  { name:"Pierre-Marie Lledo", keywords:["olfaction","adult neurogenesis","sensory perception","neural circuits","plasticity"], summary:"Studies the interplay between sensory inputs and brain plasticity in the olfactory system. Interested in how adult neurogenesis shapes odor memory and perception, how new olfactory neurons bring unique features to adult circuits, and how modified neurogenesis impacts cognitive and affective functions including perceptual learning and reward encoding.", website:"https://research.pasteur.fr/en/team/perception-and-action/", photoURL:"https://research.pasteur.fr/wp-content/uploads/2015/05/research_pasteur-pierre-marie-lledo-lledo-pierre-marie-6653-copie-scaled.jpg", subfields:["systems"], institutes:["Institut Pasteur"] },
  { name:"Thomas Bourgeron", keywords:["autism","synapse genetics","SHANK3","cognitive functions","circadian rhythms"], summary:"Studies the genetic and synaptic bases of autism spectrum disorders. Interested in how mutations in synaptic genes including SHANK3, NLGN3, and NLGN4X affect neural connectivity, and examines the interplay between polygenic architecture, circadian rhythms, and phenotypic diversity in neurodevelopmental conditions.", website:"https://research.pasteur.fr/en/team/human-genetics-and-cognitive-functions/", photoURL:"https://research.pasteur.fr/wp-content/uploads/2015/05/research.pasteur.fr_thomas-bourgeron.jpg", subfields:["human"], institutes:["Institut Pasteur"] },
  { name:"Roberto Toro", keywords:["neuroanatomy","brain morphology","computational anatomy","brain evolution","morphometry"], summary:"Develops mathematical models and computational neuroanatomy methods to understand the development and evolution of brain anatomy. Studies how biomechanical growth processes trigger mechanical instabilities constraining developmental and evolutionary trajectories, and how surface geometry variability relates to species ecology and behavior.", website:"https://neuroanatomy.github.io/people.html", photoURL:"https://research.pasteur.fr/wp-content/uploads/2015/08/research.pasteur.fr_toror.png", subfields:["computational"], institutes:["Institut Pasteur"] },
  { name:"Jean-Baptiste Masson", keywords:["Bayesian computation","decision-making","stochastic processes","Drosophila larva","embodied neuroAI"], summary:"Studies biological intelligence through Bayesian inference in the Drosophila larva nervous system. Interested in understanding how this 10,000-neuron organism exhibits complex responses to stimuli and internal states, combining automated action detection, synaptic connectivity reconstruction, and embodied neuroAI approaches to understand organizing principles of biological information processing.", website:"https://research.pasteur.fr/en/member/jean-baptiste-masson/", photoURL:"https://www.prairie-psai.fr/app/uploads/2019/11/Jean-Baptiste-Masson-1.jpg", subfields:["computational"], institutes:["Institut Pasteur"] },
  { name:"Florent Haiss", keywords:["barrel cortex","decision-making","somatosensory","two-photon imaging","optogenetics"], summary:"Studies cortical activity during sensory-guided decisions using two-photon calcium imaging, electrophysiology, and optogenetics in barrel cortex. Interested in how whisker vibrotactile information is processed in layer 2/3 circuits, and how somatosensory cortical populations encode sensory information to guide perceptual decisions.", website:"https://research.pasteur.fr/en/team/neural-circuit-dynamics-and-decision-making/", photoURL:"https://research.pasteur.fr/wp-content/uploads/2017/09/research_pasteur-d41d84dda37815ca0f_l_c08c0.jpg", subfields:["systems"], institutes:["Institut Pasteur"] },
  { name:"Aleksandra Deczkowska", keywords:["neuroimmunology","microglia","choroid plexus","brain-immune communication","aging"], summary:"Studies how immune cells shape brain development, activity, and aging, focusing on neuro-immune interactions at the choroid plexus and skull marrow niche. Interested in immune signaling driving microglial function during aging, how the microbiome influences the brain through immune pathways, and mechanisms of remote immune influence on brain physiology.", website:"https://research.pasteur.fr/en/team/brain-immune-communication/", photoURL:"https://research.pasteur.fr/wp-content/uploads/2021/04/research_pasteur-aleksandra-deczkowska-mg-4166-edit.jpg", subfields:["systems"], institutes:["Institut Pasteur"] },
  { name:"Brice Bathellier", keywords:["auditory cortex","multisensory perception","neural dynamics","population coding","computational principles"], summary:"Studies computational principles for processing auditory and multisensory information, combining two-photon imaging, electrophysiology, optogenetics, and behavioral analysis. Interested in how cortical neurons encode complex sounds, how connections between sensory modalities shape perception, and designing cortical implants for hearing rehabilitation.", website:"https://sites.google.com/bathellier-lab.org/bathellier-lab/", photoURL:"https://scholar.googleusercontent.com/citations?view_op=medium_photo&user=o4WN1kgAAAAJ", subfields:["systems","computational"], institutes:["Institut de l'Audition"] },
  { name:"Anne-Lise Giraud", keywords:["speech processing","neural oscillations","auditory cortex","hearing","neural coding"], summary:"Studies neural computations enabling speech perception and production. Interested in how delta, theta, and gamma oscillations track the multi-timescale dynamics of speech, how brain oscillations package incoming information into appropriate temporal units for language processing, and how disrupted oscillatory patterns relate to language disorders.", website:"https://research.pasteur.fr/en/team/neural-coding-and-engineering-of-human-speech-functions/", photoURL:"https://research.pasteur.fr/wp-content/uploads/2022/01/research_pasteur-anne-lise-giraud-alg.jpg", subfields:["human","computational"], institutes:["Institut de l'Audition"] },
  // ===== ESPCI =====
  { name:"Karim Benchenane", keywords:["memory","sleep","hippocampus","brain oscillations","optogenetics"], summary:"Studies memory processing during sleep and wake, investigating how coordinated brain-body states are generated and regulated during emotional contexts. Interested in how place cell activity during sleep can create explicit memory traces affecting spatial preferences, and the role of bodily feedback on affective states, using electrophysiology and optogenetics in behaving mice.", website:"https://benchenanelab.com/", photoURL:"https://benchenanelab.com/wp-content/uploads/2015/11/22692426301_4eabedf196_o.jpg", subfields:["systems"], institutes:["ESPCI Paris"] },
  { name:"Gisella Vetere", keywords:["memory engrams","neural circuits","optogenetics","whole-brain imaging","memory consolidation"], summary:"Studies mechanisms underlying memory acquisition, consolidation, and recall, investigating the synaptic and circuit bases of memory engrams. Interested in how different neural populations active during distinct encoding periods contribute to recall, how artificial memories can be created through targeted neural activation, and whole-brain network dynamics of memory using graph theory and imaging.", website:"https://veterelab.weebly.com/", photoURL:"https://veterelab.weebly.com/uploads/1/2/3/8/123849513/vetere-picture-website_orig.jpg", subfields:["systems"], institutes:["ESPCI Paris"] },
  { name:"Philippe Faure", keywords:["dopamine","nicotine","addiction","reward","decision-making"], summary:"Studies decision-making mechanisms and their alterations in nicotine addiction, combining behavioral approaches, electrophysiology, optogenetics, and modeling. Interested in how midbrain dopamine circuits mediate motivational control, how chronic nicotine alters exploration-exploitation trade-offs in decision-making, and how early nicotine exposure affects dopaminergic circuit maturation.", website:"https://faurelab.cnrs.fr/", photoURL:"", subfields:["systems"], institutes:["ESPCI Paris"] },
  { name:"Mickael Tanter", keywords:["functional ultrasound imaging","brain imaging","ultrafast ultrasound","neurovascular coupling"], summary:"Develops functional ultrasound neuroimaging technology exploiting neurovascular coupling, using ultrafast Doppler methods to achieve sensitivity to slow blood flow in small cerebral vessels. Interested in mapping subtle blood flow variations related to neuronal activity at thousands of frames per second, combined with ultrasound localization microscopy for microscopic spatial resolution.", website:"https://www.physicsformedicine.espci.fr/", photoURL:"https://www.physicsformedicine.espci.fr/files/2025/10/Mickael-Tanter.png", subfields:["systems","computational"], institutes:["ESPCI Paris"] },
  // ===== College de France / NeuroSpin =====
  { name:"Stanislas Dehaene", keywords:["consciousness","number cognition","reading","global neuronal workspace","brain imaging"], summary:"Studies consciousness, number sense, and reading using the global neuronal workspace framework, which proposes that conscious access occurs when information is broadly broadcast by interconnected frontal-parietal regions. Interested in neural signatures of consciousness, how humans uniquely process symbolic systems like numbers and written language, and applying these frameworks to diagnose disorders of consciousness.", website:"https://www.college-de-france.fr/en/chair/stanislas-dehaene-experimental-cognitive-psychology-statutory-chair", photoURL:"https://www.edge.org/sites/default/files/styles/member-photo/public/member-pictures/picture-47-1517505912.jpg", subfields:["human","computational"], institutes:["College de France","CEA NeuroSpin"] },
  { name:"Ghislaine Dehaene-Lambertz", keywords:["infant brain development","language acquisition","fMRI","neural architecture","neonatal cognition"], summary:"Studies how the infant brain is organized to acquire language, using functional brain imaging adapted for neonates and young children. Interested in functional organization and lateralization of language processing in infant brains, how early brain organization promotes language learning, and anatomical and functional development in neonatal cognition.", website:"https://www.unicog.org/", photoURL:"https://cdn-ilakmbb.nitrocdn.com/jIYMIjeZjxbibSovbmtXtpmbltiBOKUt/assets/images/optimized/rev-d2b9beb/cerveau-enfant.org/wp-content/uploads/2024/05/Ghislaine-Dehaene-Lambertz-300x300.jpg", subfields:["human"], institutes:["CEA NeuroSpin"] },
  { name:"Florent Meyniel", keywords:["uncertainty","Bayesian inference","confidence","sequence learning","fMRI"], summary:"Studies how the brain estimates and represents uncertainty during learning and decision-making. Interested in how subjective confidence derives from Bayesian inference, how brain networks disentangle sources of uncertainty, and how confidence dynamically modulates stimulus-evoked responses amplifying surprise while dampening signals when confident.", website:"https://florentmeyniel.weebly.com/", photoURL:"https://florentmeyniel.weebly.com/uploads/5/9/7/2/59727215/published/florent-steanne-2023-1.jpg", subfields:["computational","human"], institutes:["CEA NeuroSpin"] },
  { name:"Virginie van Wassenhove", keywords:["temporal cognition","multisensory integration","neural oscillations","MEG","time perception"], summary:"Studies temporal cognition and multisensory perception, investigating whether neural oscillations define perceptual moments through their phase dynamics. Interested in how temporal predictions formed from sensory statistics guide attention, how the brain arbitrates between integrating and segregating multisensory information, and neural correlates of spatiotemporal binding.", website:"https://brainthemind.com/", photoURL:"https://www.polytechnique-insights.com/wp-content/uploads/2025/02/virginie-van-wassenhove.jpg", subfields:["computational","human"], institutes:["CEA NeuroSpin"] },
  { name:"Bertrand Thirion", keywords:["machine learning","neuroimaging","statistical modeling","brain mapping","scikit-learn"], summary:"Develops machine learning methods for neuroimaging data analysis including multivariate analysis of activation images and resting-state time series. Interested in supervised learning for brain decoding and encoding, unsupervised learning to uncover hidden structures, and creating accessible software tools like Nilearn for statistical learning on neuroimaging data.", website:"https://pages.saclay.inria.fr/bertrand.thirion/", photoURL:"https://www.msr-inria.fr/files/wp-content/uploads/2013/04/bertrand-thirion.jpg", subfields:["computational"], institutes:["CEA NeuroSpin","INRIA Paris"] },
  { name:"Sophie Herbst", keywords:["temporal predictions","Bayesian modeling","auditory processing","EEG","MEG"], summary:"Studies how temporal predictions form implicitly from temporal statistics of sensory inputs using Bayesian models. Interested in how these predictions interact with auditory analysis to benefit hearing, how temporal hazard can be tracked in human EEG, and functional routes of temporal prediction involving subcortical structures like the cerebellum.", website:"https://brainthemind.com/sophie-herbst/", photoURL:"https://scholar.googleusercontent.com/citations?view_op=view_photo&user=kOfJc5MAAAAJ&citpid=1", subfields:["computational","human"], institutes:["CEA NeuroSpin"] },
  // ===== NeuroPSI =====
  { name:"Daniel Shulz", keywords:["barrel cortex","whisker somatosensory system","sensory processing","tactile encoding"], summary:"Studies tactile sensory coding, plasticity, and perception in the primary somatosensory cortex. Interested in how barrel cortex integrates spatially distributed tactile information, co-existing coding schemes depending on input statistics, and multi-whisker integration across thalamic and cortical layers.", website:"https://neuropsi.cnrs.fr/en/daniel-shulz-translated/", photoURL:"https://www.universite-paris-saclay.fr/sites/default/files/2024-02/daniel-shulz.jpg", subfields:["systems"], institutes:["NeuroPSI (Paris-Saclay)"] },
  { name:"Tihana Jovanic", keywords:["Drosophila larva","sensorimotor decisions","neural circuits","action sequences","behavior"], summary:"Studies neural circuits for sensorimotor decisions and action sequences using Drosophila larva genetic tools for single-neuron manipulation and connectivity reconstruction via electron microscopy. Interested in how contextual information modulates behavioral choices, brain-wide mechanisms underlying competitive interactions between actions, and computational principles modulated by internal state.", website:"https://neuropsi.cnrs.fr/en/departments/cnn/group-leader-tihana-jovanic/", photoURL:"https://research.pasteur.fr/wp-content/uploads/2024/02/research_pasteur-entihana-jovanic-research-pasteur-entihana-jovanic-screenshot-2024-02-28-at-16.13.17.jpg", subfields:["systems","computational"], institutes:["NeuroPSI (Paris-Saclay)"] },
  // ===== Universite Paris Cite =====
  { name:"Laura Dugue", keywords:["brain oscillations","perception","attention","traveling waves","TMS"], summary:"Studies the spatio-temporal organization of brain oscillations and their functional role in perception and attention. Interested in dissociating theta rhythms underlying attentional fluctuations from alpha rhythms modulating perceptual performance, using TMS to provide causal evidence for periodic interference in visual processing, and investigating alpha traveling waves indexing spatial attention.", website:"https://www.duguelab.com/", photoURL:"https://incc-paris.fr/wp-content/uploads/LD_web.png", subfields:["computational","human"], institutes:["INCC - Universite Paris Cite"] },
  { name:"Claire Sergent", keywords:["consciousness","conscious perception","global workspace","EEG","computational modelling"], summary:"Investigates psychological and neural foundations of consciousness using experimental psychology, neuroimaging, and computational modeling. Studies mechanisms of conscious processing through the global neuronal workspace framework, exploring how conscious perception relates to fronto-parietal network involvement and long-distance functional connectivity.", website:"https://sergent-consciousness-lab.u-paris.fr/", photoURL:"https://incc-paris.fr/wp-content/uploads/clairesergent-1.jpg", subfields:["human","computational"], institutes:["INCC - Universite Paris Cite"] },
  { name:"Belen Pardi", keywords:["sensory perception","neocortical circuits","learning","top-down signaling","zona incerta"], summary:"Studies neuronal circuits for adaptive sensory perception, investigating GABAergic projections from zona incerta as a major source of top-down input to neocortex. Interested in how top-down signals encoding previous experiences converge with bottom-up sensory information to enable perception and memory, and how incertocortical transmission changes during learning.", website:"https://sites.google.com/view/pardi-lab/presentation", photoURL:"https://scholar.googleusercontent.com/citations?view_op=view_photo&user=hR_AsFUAAAAJ&citpid=1", subfields:["systems"], institutes:["IPNP - Universite Paris Cite"] },
  { name:"David Hansel", keywords:["neural network theory","cortical dynamics","balanced networks","working memory","irregular activity"], summary:"Studies how balanced excitation and inhibition in cortical networks support computations like working memory while maintaining irregular firing patterns. Interested in how neural networks sustain persistent activity with realistic spike statistics, and uses mean-field approaches to understand attractor dynamics where inhibition and excitation balance each other.", website:"https://incc-paris.fr/people/david-hansel/", photoURL:"https://incc-paris.fr/wp-content/uploads/davidhansel.jpg", subfields:["computational"], institutes:["SPPIN - Universite Paris Cite"] },
  { name:"Michael Graupner", keywords:["synaptic plasticity","calcium-based models","cerebellar motor control","neural network dynamics"], summary:"Develops calcium-based models of synaptic plasticity where intermediate calcium levels depress synapses while high transients potentiate them. Studies how this framework explains sensitivity of long-term potentiation and depression to spike patterns across cortical, hippocampal, and cerebellar systems.", website:"https://www.sppin.fr/members/michael-graupner/", photoURL:"https://www.sppin.fr/wp-content/uploads/2023/09/michael_graupner.jpg", subfields:["computational"], institutes:["SPPIN - Universite Paris Cite"] },
  { name:"Desdemona Fricker", keywords:["head direction system","spatial orientation","presubiculum","hippocampus","electrophysiology"], summary:"Studies the neural basis of spatial orientation in the presubicular microcircuit. Interested in how Martinotti interneurons interact with pyramidal cells to maintain head direction signals, how feedback inhibition enables precisely timed spikes, and multi-sensory integration of vestibular and visual inputs for spatial orientation.", website:"https://www.sppin.fr/members/desdemona-fricker/", photoURL:"https://www.sppin.fr/wp-content/uploads/2023/09/Desdemona_Fricker-1.jpg", subfields:["systems"], institutes:["SPPIN - Universite Paris Cite"] },
  { name:"Fani Koukouli", keywords:["cholinergic modulation","nicotinic receptors","cortical inhibitory circuits","neurodegeneration","prefrontal cortex"], summary:"Studies cholinergic modulation of cortical inhibitory circuits in neurodegenerative and psychiatric disorders. Interested in how cholinergic transmission affects specific cortical subnetworks, how interneuron computations are affected by genetic variants of acetylcholine receptors, and how nicotinic receptors serve as early targets in Alzheimer's disease.", website:"https://ipnp.paris5.inserm.fr/research/teams-and-projects", photoURL:"https://inserm.b-cdn.net/wp-content/uploads/2025/07/FaniKoukouli.jpg", subfields:["systems"], institutes:["IPNP - Universite Paris Cite"] },
  // ===== Sorbonne / Institut de la Vision =====
  { name:"Mehdi Khamassi", keywords:["reinforcement learning","decision-making","robotics","basal ganglia","social learning"], summary:"Studies decision-making and reinforcement learning in mammalian brains, taking biological inspiration to improve robot autonomy. Interested in actor-critic models of dopamine-like learning in basal ganglia, how gating networks learn efficient strategies, exploration-exploitation trade-offs, and whether similar learning mechanisms apply across social and non-social contexts.", website:"https://pages2.isir.upmc.fr/mkhamassi/", photoURL:"https://www.isir.upmc.fr/wp-content/uploads/2021/06/pict20210624_162208_0-copie-1-300x300.jpg", subfields:["computational"], institutes:["ISIR - Sorbonne Universite"] },
  { name:"Romain Brette", keywords:["spiking neural networks","action potentials","neural coding","Brian simulator","sensory systems"], summary:"Studies computational neuroscience of sensory systems focusing on biophysics of action potentials and spike-timing-based computation. Interested in theoretical understanding of action potential initiation, the Brian spiking neural network simulator enabling efficient simulation through code generation, and investigating proto-cognition in single-celled organisms.", website:"https://romainbrette.fr/", photoURL:"https://briansimulator.org/photos/romain_brette.jpg", subfields:["computational"], institutes:["Institut de la Vision"] },
  { name:"Ulisse Ferrari", keywords:["retinal encoding","neural correlations","population coding","statistical physics","optogenetics"], summary:"Studies collective behavior of neurons and how neuronal networks encode information through population spiking activity in retina and cortex. Interested in the interplay between stimulus-induced correlations and noise correlations in population responses, and how homogeneous retinal ganglion cell populations can simultaneously encode different visual features through position-dependent properties.", website:"https://www.institut-vision.org/en/", photoURL:"https://www.institut-vision.org/sites/default/files/styles/chercheur/public/chercheurs/Ulisse_Ferrari.jpg.webp?itok=pbh-Uxvu", subfields:["computational"], institutes:["Institut de la Vision"] },
  // ===== IBENS / ENS new =====
  { name:"Jonas Ranft", keywords:["statistical physics","neural circuits","synaptic structure","oscillations","dynamical systems"], summary:"Uses statistical physics and dynamical systems to study neural systems from molecular to network scales. Interested in how molecular composition of synaptic terminals fluctuates yet stabilizes for long-term plasticity, and how structured connectivity and oscillator heterogeneity shape network noise and temporal correlations.", website:"https://qbio.ens.psl.eu/en/people/jonas-ranft", photoURL:"https://qbio.ens.psl.eu/sites/ens/files/2022-11/Jonas%20Ranft.jpeg", subfields:["computational"], institutes:["IBENS - ENS"] },
  { name:"Vincent Villette", keywords:["voltage imaging","two-photon microscopy","inhibitory circuits","hippocampus","optical methods"], summary:"Develops advanced optical methods for measuring electrical activity using genetically encoded voltage indicators and ultrafast two-photon imaging. Interested in dual-polarity voltage imaging enabling simultaneous tracking of excitatory and inhibitory neuron dynamics, achieving submillisecond temporal resolution for monitoring spikes in deep brain locations of awake behaving mice.", website:"https://www.bio.ens.psl.eu/depbio/", photoURL:"https://images.cnrs.fr/sites/default/files/media/videos/7514/MN03026_hd_00013000.jpg", subfields:["systems"], institutes:["IBENS - ENS"] },

// ---------- SEED FUNCTIONS ----------

async function seedInstitutes() {
  log('--- Seeding Institutes ---', 'info');
  for (const inst of institutes) {
    // Check if already exists
    const q = query(collection(db, 'institutes'), where('name', '==', inst.name), where('status', '==', 'approved'));
    const snap = await getDocs(q);
    if (snap.size > 0) {
      log(`  Skip (exists): ${inst.name}`);
      continue;
    }
    await addDoc(collection(db, 'institutes'), {
      name: inst.name,
      website: inst.website,
      status: 'approved',
      proposedBy: currentUser.uid,
      createdAt: serverTimestamp()
    });
    log(`  Created: ${inst.name}`, 'success');
  }
}

async function seedPIs() {
  log('--- Seeding PIs ---', 'info');
  let created = 0, skipped = 0;
  for (const pi of pis) {
    // Check if PI already exists by name
    const q = query(collection(db, 'groups'), where('name', '==', pi.name));
    const snap = await getDocs(q);
    if (snap.size > 0) {
      log(`  Skip (exists): ${pi.name}`);
      skipped++;
      continue;
    }
    await addDoc(collection(db, 'groups'), {
      name: pi.name,
      keywords: pi.keywords,
      summary: pi.summary,
      links: [{ label: 'Website', url: pi.website }],
      photoURL: pi.photoURL || '',
      subfields: pi.subfields,
      institutes: pi.institutes,
      subfield: pi.subfields[0],
      institute: pi.institutes[0],
      creatorUid: currentUser.uid,
      createdAt: serverTimestamp(),
      updatedAt: serverTimestamp()
    });
    log(`  Created: ${pi.name}`, 'success');
    created++;
  }
  log(`\nDone! Created ${created}, skipped ${skipped} (already existed).`, 'info');
}

async function updatePIs() {
  log('--- Updating Existing PIs ---', 'info');
  let updated = 0, notFound = 0;
  for (const pi of pis) {
    const q = query(collection(db, 'groups'), where('name', '==', pi.name));
    const snap = await getDocs(q);
    if (snap.empty) {
      log(`  Not found: ${pi.name}`, 'error');
      notFound++;
      continue;
    }
    const docRef = doc(db, 'groups', snap.docs[0].id);
    await updateDoc(docRef, {
      summary: pi.summary,
      keywords: pi.keywords,
      subfields: pi.subfields,
      subfield: pi.subfields[0],
      photoURL: pi.photoURL || '',
      links: [{ label: 'Website', url: pi.website }],
      updatedAt: serverTimestamp()
    });
    log(`  Updated: ${pi.name}`, 'success');
    updated++;
  }
  log(`\nDone! Updated ${updated}, not found ${notFound}.`, 'info');
}

window.runSeed = async () => {
  document.getElementById('seedBtn').disabled = true;
  document.getElementById('updateBtn').disabled = true;
  try {
    await seedInstitutes();
    await seedPIs();
  } catch (e) {
    log('ERROR: ' + e.message, 'error');
  }
  document.getElementById('seedBtn').disabled = false;
  document.getElementById('updateBtn').disabled = false;
};

window.runUpdate = async () => {
  document.getElementById('seedBtn').disabled = true;
  document.getElementById('updateBtn').disabled = true;
  try {
    await updatePIs();
  } catch (e) {
    log('ERROR: ' + e.message, 'error');
  }
  document.getElementById('seedBtn').disabled = false;
  document.getElementById('updateBtn').disabled = false;
};
</script>
